name: Software checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  software:
    name: Software behavior and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install the declared Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
          rustup default 1.91.0
      - name: Run software checks
        run: make check

# Physical RF accuracy, LiDAR/array/ESP qualification, and the 14-day run are
# separate acceptance work. This workflow never reports their absence as PASS.
