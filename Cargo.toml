[package]
name = "whisper"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A deterministic, replayable RF world model"
license = "MIT"

# Isolate this single package from the unrelated parent workspace.
[workspace]

[features]
default = []
development-fixture = []
ingest-test-hooks = []

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ciborium = "0.2.2"
mimalloc = "0.1.48"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.5"

[dev-dependencies]
serde_json = "1.0.149"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.2", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
