[package]
name = "whisper"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A deterministic, replayable RF world model"
license = "MIT"

# Isolate this single package from the unrelated parent workspace.
[workspace]

[features]
default = []
development-fixture = []
ingest-test-hooks = []

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ciborium = "0.2.2"
mimalloc = "0.1.48"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.5"

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8.9", features = ["json", "tokio", "ws"] }
futures-util = "0.3.34"
libc = "0.2.189"
rustix = { version = "1.1.2", features = ["process"] }
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
tokio-tungstenite = "0.29.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
