[package]
name = "whisper"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Preserved native RF input contracts for the Whisper world-model rebuild"
license.workspace = true

# Isolate this single package from the unrelated parent workspace.
[workspace]
members = []
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
libc = "0.2.189"
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.2", default-features = false, features = ["process"] }
sha2 = "0.10.9"
thiserror = "2.0.17"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dependencies]
aes-gcm.workspace = true
rusqlite.workspace = true
rustix.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
