[deployment]
id = "lab"

[capture]
bind = "127.0.0.1:9000"
max_datagram_bytes = 4096
socket_buffer_bytes = 65535
secret_root = "./data/secrets"

[session]
database_path = "./data/whisper.sqlite3"
max_manifest_bytes = 1048576
max_record_bytes = 1048576
max_session_duration_ns = 1800000000000
max_session_bytes = 1073741824
retention_max_sessions = 8

[window]
width_ns = 1000000000
step_ns = 1000000000
allowed_lateness_ns = 100000000
inactive_after_ns = 5000000000
reorder_horizon = 64

[conditioning]
version = "amplitude-v1"
recipe = "log1p-hypot"
scale_numerator = 1
scale_denominator = 2

[quality]
minimum_frames = 4
minimum_coordinate_coverage = 0.75
maximum_gap_ratio = 0.1
maximum_receive_jitter_ns = 100000000
minimum_time_quality = "receive_only"

[baseline]
minimum_learning_windows = 10
minimum_valid_exposure_ns = 5000000000
minimum_samples_per_coordinate = 2
minimum_exposure_per_coordinate_ns = 1000000000
minimum_ready_coordinate_coverage = 0.75
variance_floor = 0.000001
ew_time_constant_ns = 30000000000
deviation_quantile = 0.95
rf_dynamics_quantile = 0.95
adaptation_gate = 0.75
stable_threshold = 2.0
changing_threshold = 4.0
stale_after_ns = 60000000000

[view]
recent_range_ns = 60000000000
max_time_buckets = 512
max_signal_points = 200000

[server]
bind = "127.0.0.1:8080"
recent_range_ns = 60000000000
command_queue_capacity = 64
websocket_queue_capacity = 64

[performance]
max_rss_bytes = 536870912
max_cpu_threads = 4
snapshot_deadline_ns = 400000000

[[spaces]]
id = "room"

[[transmitters]]
id = "tx-a"

[[transmitters]]
id = "tx-b"

