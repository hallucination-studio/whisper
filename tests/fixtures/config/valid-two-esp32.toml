[deployment]
id = "lab"

[capture]
bind = "127.0.0.1:9000"
max_datagram_bytes = 4096
socket_buffer_bytes = 65535

[session]
directory = "./data/sessions"
max_manifest_bytes = 1048576
max_record_bytes = 1048576
max_session_duration_ns = 1800000000000
max_session_bytes = 1073741824
retention_max_sessions = 8
flush_policy = "every_record"

[window]
width_ns = 1000000000
step_ns = 1000000000
allowed_lateness_ns = 100000000
inactive_after_ns = 5000000000
reorder_horizon = 64
probable_restart_after_ns = 30000000000

[conditioning]
version = "amplitude-v1"
recipe = "log1p-hypot"
scale_numerator = 1
scale_denominator = 2

[quality]
minimum_frames = 4
minimum_coordinate_coverage = 0.75
maximum_gap_ratio = 0.1
maximum_receive_jitter_ns = 100000000
minimum_time_quality = "receive_only"

[baseline]
minimum_learning_windows = 10
minimum_valid_exposure_ns = 5000000000
minimum_samples_per_coordinate = 2
minimum_exposure_per_coordinate_ns = 1000000000
minimum_ready_coordinate_coverage = 0.75
variance_floor = 0.000001
ew_time_constant_ns = 30000000000
deviation_quantile = 0.95
rf_dynamics_quantile = 0.95
adaptation_gate = 0.75
stable_threshold = 2.0
changing_threshold = 4.0
stale_after_ns = 60000000000

[view]
recent_range_ns = 60000000000
max_time_buckets = 512
max_signal_points = 200000

[server]
bind = "127.0.0.1:8080"
recent_range_ns = 60000000000
command_queue_capacity = 64
websocket_queue_capacity = 64

[performance]
max_rss_bytes = 536870912
max_cpu_threads = 4
snapshot_deadline_ns = 400000000

[candidate]
mode = "disabled"

[[spaces]]
id = "room"

[[transmitters]]
id = "tx-a"

[[transmitters]]
id = "tx-b"

[[sensors]]
id = "sensor-a"
hardware_kind = "esp32-s3"
node_id = 1
expected_peer_ip = "192.0.2.10"
firmware = "adr018-s3-1"

[sensors.adr018]
firmware_dialect = "esp-idf"
he_tagging = false
csi_acquire = "wifi-csi"
ltf_selection = "legacy"
ltf_merge = "none"
validity_dialect = "first-word-invalid"
multi_path = false

[[sensors]]
id = "sensor-b"
hardware_kind = "esp32-c6"
node_id = 2
expected_peer_ip = "192.0.2.11"
firmware = "adr018-c6-1"

[sensors.adr018]
firmware_dialect = "esp-idf-he"
he_tagging = true
csi_acquire = "wifi-csi"
ltf_selection = "he"
ltf_merge = "firmware-defined"
validity_dialect = "missing-frame-validity"
multi_path = false

[[links]]
id = "link-a"
space = "room"
transmitter = "tx-a"
receiver = "sensor-a"

[links.source_contract]
provisioned = true
fixed_source_mac_filter = false

[links.channel_policy]
allowed = [1, 6]
expected = 1

[[links]]
id = "link-b"
space = "room"
transmitter = "tx-b"
receiver = "sensor-b"

[links.source_contract]
provisioned = true
fixed_source_mac_filter = true

[links.channel_policy]
allowed = [6, 11]
expected = 6

[[routes]]
peer = "192.0.2.10"
node_id = 1
link = "link-a"
peak_packets_per_second = 100
maximum_valid_datagram_bytes = 2048
channel = 1

[[routes]]
peer = "192.0.2.11"
node_id = 2
link = "link-b"
peak_packets_per_second = 100
maximum_valid_datagram_bytes = 4096
channel = 6
